<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Felicissimo | Produtos Cadastrados</title>
    <link rel="stylesheet" href="/produtos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
</head>
<body>

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <i class="fa-solid fa-chart-line"></i> E-Felicissimo
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="/dashboard" class="menu-link">
                        <i class="fa-solid fa-house"></i> Início
                    </a>
                </li>
                <li>
                    <a href="/precificacao" class="menu-link">
                        <i class="fa-solid fa-calculator"></i> Precificação
                    </a>
                </li>
                <li>
                    <a href="/produtos" class="menu-link active">
                        <i class="fa-solid fa-box"></i> Produtos Cadastrados
                    </a>
                </li>
                <li>
                    <a href="/perfil" class="menu-link">
                        <i class="fa-solid fa-user-gear"></i> Perfil & Configurações
                    </a>
                </li>
            </ul>
        </div>
        <div>
            <a href="/logout" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </a>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <div class="header">
            <div>
                <h2>Produtos Cadastrados 📦</h2>
                <p>Gerencie, edite valores incorretos ou exclua produtos do seu catálogo.</p>
            </div>
            <a href="/precificacao" class="btn-novo">
                <i class="fa-solid fa-plus"></i> Novo Produto
            </a>
        </div>

        <div class="card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Nome do Produto</th>
                            <th>Custo Total</th>
                            <th>Preço de Venda</th>
                            <th>Lucro Líquido</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutosBody">
                        <!-- Carregado via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- SCRIPT DE CARREGAMENTO -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarProdutos();
        });

        async function carregarProdutos() {
            try {
                const response = await fetch('/api/produtos');
                if (!response.ok) throw new Error('Erro ao buscar produtos');
                const produtos = await response.json();

                const tbody = document.getElementById('tabelaProdutosBody');
                tbody.innerHTML = '';

                if (!produtos || produtos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: #64748b;">Nenhum produto cadastrado até o momento.</td></tr>`;
                    return;
                }

                produtos.forEach(p => {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>
                            <a href="/produto-detalhe?id=${p.id}" style="color: var(--primary, #2563eb); text-decoration: none; font-weight: 600;">${p.nome}</a>
                        </td>
                        <td style="color: #475569;">${formatarMoeda(p.custoTotalCalculado || 0)}</td>
                        <td style="font-weight: 700;">${formatarMoeda(p.precoVendaCalculado || 0)}</td>
                        <td style="font-weight: 600; color: #166534;">${formatarMoeda(p.lucroLiquidoCalculado || 0)}</td>
                        <td style="text-align: center;">
                            <div style="display: inline-flex; gap: 0.5rem; justify-content: center;">
                                <a href="/produto-detalhe?id=${p.id}" style="background: #e0f2fe; color: #0369a1; border: none; padding: 0.4rem 0.75rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem;">
                                    <i class="fa-solid fa-pen-to-square"></i> Editar
                                </a>
                                <button onclick="excluirProduto(${p.id})" style="background: #fee2e2; color: #991b1b; border: none; padding: 0.4rem 0.75rem; border-radius: 4px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem;">
                                    <i class="fa-solid fa-trash"></i> Excluir
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function excluirProduto(id) {
            if (confirm('Tem certeza de que deseja excluir este produto permanentemente?')) {
                try {
                    const response = await fetch(`/api/produtos/${id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        alert('Produto excluído com sucesso!');
                        carregarProdutos();
                    } else {
                        alert('Erro ao excluir o produto.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Erro na requisição de exclusão.');
                }
            }
        }

        function formatarMoeda(valor) {
            return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
    </script>
</body>
</html>
