<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Felicissimo - Perfil & Configurações</title>
    <link rel="stylesheet" href="/./src/views/perfil.css">
    
</head>
<body>

    <!-- BARRA LATERAL -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand-wrapper">
                <div class="sidebar-brand">⚡ E-Felicissimo</div>
                <button class="theme-btn" id="btnTheme" onclick="toggleTheme()" title="Alternar Tema">🌙</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/">🏠 Início</a></li>
                <li><a href="/dashboard">📊 Dashboard</a></li>
                <li><a href="/precificacao">🧮 Precificação</a></li>
                <li><a href="/produtos">📦 Produtos Cadastrados</a></li>
                <li><a href="/perfil" class="active">👤 Perfil & Configurações</a></li>
            </ul>
        </div>
        <div>
            <ul class="sidebar-menu">
                <li><a href="/" style="color: #dc2626;">🚪 Sair</a></li>
            </ul>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <div class="page-header">
            <h1>Perfil & Configurações 👤</h1>
            <p>Gerencie seus padrões fiscais e custos operacionais automáticos para o e-commerce.</p>
        </div>

        <form id="formPerfil" onsubmit="salvarConfiguracoes(event)">
            <!-- SEÇÃO REGIME FISCAL -->
            <div class="form-section-card">
                <h3>📄 Regime Fiscal / NF</h3>
                
                <label class="checkbox-group">
                    <input type="checkbox" id="usarNF" name="usarNF"> Emitir Nota Fiscal nos Cálculos
                </label>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="percentualNF">Alíquota da Nota Fiscal (%)</label>
                    <input type="number" step="0.01" class="form-control" id="percentualNF" name="percentualNF" value="0.00">
                </div>
            </div>

            <!-- SEÇÃO CUSTOS OPERACIONAIS -->
            <div class="form-section-card">
                <h3>📦 Custos Operacionais Padrões</h3>
                
                <label class="checkbox-group">
                    <input type="checkbox" id="usarEmbalagem" name="usarEmbalagem"> Considerar Custo de Embalagem
                </label>
                <div class="form-group">
                    <label for="custoEmbalagem">Custo Médio por Caixa/Saco (R$)</label>
                    <input type="number" step="0.01" class="form-control" id="custoEmbalagem" name="custoEmbalagem" value="0.00">
                </div>

                <label class="checkbox-group" style="margin-top: 1.2rem;">
                    <input type="checkbox" id="usarGasolina" name="usarGasolina"> Considerar Transporte/Gasolina
                </label>
                <div class="form-group">
                    <label for="custoGasolina">Custo de Deslocamento Rateado (R$)</label>
                    <input type="number" step="0.01" class="form-control" id="custoGasolina" name="custoGasolina" value="0.00">
                </div>

                <label class="checkbox-group" style="margin-top: 1.2rem;">
                    <input type="checkbox" id="usarOutros" name="usarOutros"> Considerar Outros Custos Extras
                </label>
                <div class="form-group">
                    <label for="custoOutros">Valor Outros Custos (R$)</label>
                    <input type="number" step="0.01" class="form-control" id="custoOutros" name="custoOutros" value="0.00">
                </div>
            </div>

            <button type="submit" class="btn-main">💾 Salvar Configurações</button>
        </form>
    </main>

    <script>
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('btnTheme');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                btn.innerText = '🌙';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '☀️';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Carregar configurações ao abrir a página
        window.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                const btn = document.getElementById('btnTheme');
                if (btn) btn.innerText = '☀️';
            }

            try {
                const response = await fetch('/api/perfil');
                if (response.ok) {
                    const perfil = await response.json();
                    
                    document.getElementById('usarNF').checked = !!perfil.usarNF;
                    document.getElementById('percentualNF').value = perfil.percentualNF || 0;
                    
                    document.getElementById('usarEmbalagem').checked = !!perfil.usarEmbalagem;
                    document.getElementById('custoEmbalagem').value = perfil.custoEmbalagem || 0;
                    
                    document.getElementById('usarGasolina').checked = !!perfil.usarGasolina;
                    document.getElementById('custoGasolina').value = perfil.custoGasolina || 0;
                    
                    document.getElementById('usarOutros').checked = !!perfil.usarOutros;
                    document.getElementById('custoOutros').value = perfil.custoOutros || 0;
                }
            } catch (error) {
                console.error('Erro ao carregar dados do perfil:', error);
            }
        });

        // Salvar configurações via API
        async function salvarConfiguracoes(event) {
            event.preventDefault();

            const dados = {
                usarNF: document.getElementById('usarNF').checked,
                percentualNF: parseFloat(document.getElementById('percentualNF').value) || 0,
                usarEmbalagem: document.getElementById('usarEmbalagem').checked,
                custoEmbalagem: parseFloat(document.getElementById('custoEmbalagem').value) || 0,
                usarGasolina: document.getElementById('usarGasolina').checked,
                custoGasolina: parseFloat(document.getElementById('custoGasolina').value) || 0,
                usarOutros: document.getElementById('usarOutros').checked,
                custoOutros: parseFloat(document.getElementById('custoOutros').value) || 0
            };

            try {
                const response = await fetch('/api/perfil', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert('Configurações salvas com sucesso!');
                } else {
                    alert('Erro ao salvar as configurações no servidor.');
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                alert('Erro de conexão com o servidor.');
            }
        }
    </script>
</body>
</html>
